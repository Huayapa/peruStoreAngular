<main class="shop">
  <div class="container">
    <app-banner-section title="Tienda" />
    <div class="shop__main">
      <aside class="shop__filters">
        <app-shop-filter [categories]="categories()" (filterChange)="onFilterChange($event)" />
      </aside>
      <div class="shop__content">
        <app-shop-products [products]="products().products" />
        <app-shop-pagination
          [page]="page()"
          [totalPages]="totalPages()"
          (pageChange)="onPageChange($event)"
        />
      </div>
    </div>
  </div>
</main>
