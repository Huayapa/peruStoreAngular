services:
  backend:
    build: 
      context: ./server
      target: development
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - app-network

  frontend:
    build: 
      context: ./
      target: development
    ports:
      - "4200:4200"
    restart: always
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge