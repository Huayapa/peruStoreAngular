<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  {{ data.message }}
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onCancel()">{{ data.cancelText ?? 'No' }}</button>
  <button matButton cdkFocusInitial (click)="onConfirm()">{{ data.confirmText ?? 'Si' }}</button>
</mat-dialog-actions>
