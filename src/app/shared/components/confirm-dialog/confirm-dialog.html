<h2 mat-dialog-title>Los datos se perderan</h2>
<mat-dialog-content>
  ¿Seguro que deseas salir? Los cambios que implemento se perderán.
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton (click)="onCancel()">No</button>
  <button matButton cdkFocusInitial (click)="onConfirm()">Si</button>
</mat-dialog-actions>
