<header class="header">
  <section class="header__top" [class.header__top--hidden]="hideTop">
    <span class="header__span">Calle Gran Vía 45, 28013 Madrid, Pais falso.</span>
    <span class="header__span">example@gmail.com</span>
  </section>

  <section class="header__content">
    <div class="header__logo" [routerLink]="`/${APP_ROUTES.HOME.ROOT}`" role="link">
      <img [routerLink]="" src="/image/logo2.png" alt="Logo" class="header__img" />
      <h2 class="header__logo-title">Peru Store</h2>
    </div>
    <div class="header__bar">
      <nav class="header__navbar">
        <a class="header__link" [routerLink]="`/${APP_ROUTES.HOME.ROOT}`">Inicio</a>
        <a class="header__link" [routerLink]="`/${APP_ROUTES.PRODUCTS.ROOT}`">Tienda</a>
      </nav>
      <div class="header__actions">
        <app-search-bar class="header__main-search" />
        <button class="header__cart-btn" matIconButton (click)="sidenav.toogleSideCart()">
          <mat-icon fontIcon="shopping_cart"></mat-icon>
        </button>
        <button
          matIconButton
          [routerLink]="`/${APP_ROUTES.AUTH.ROOT}/${APP_ROUTES.AUTH.LOGIN.ROOT}`"
        >
          <mat-icon fontIcon="login"></mat-icon>
        </button>
        <button matIconButton class="header__btn" (click)="sidenav.toogleSideBar()">
          <mat-icon fontIcon="menu"></mat-icon>
        </button>
      </div>
    </div>
  </section>
</header>

@if (sidenav.sideActive() !== 'none') {
  <div class="side">
    <div class="side__main">
      @if (sidenav.sideActive() === 'sidecart') {
        <app-sidecart />
      } @else if (sidenav.sideActive() === 'sidebar') {
        <app-sidebar />
      }
    </div>
    <div class="side__overlay" role="button" tabindex="0" (click)="sidenav.closeOverlay()"></div>
  </div>
}
